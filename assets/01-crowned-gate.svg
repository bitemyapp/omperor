<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Omperor's mark: the crown from the sidebar header, gold on the canvas's dark, with the plum of the brand behind it. Drawn here as its own geometry; the interface's glyph is an SF Symbol, which may not be used in an icon. The artwork fills the canvas edge to edge: macOS masks an icon into its own shape and lays its own shadow under it. -->
<defs>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2B30"/><stop offset="1" stop-color="#17171B"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.6" r="0.62"><stop offset="0" stop-color="#5B1A4A" stop-opacity="0.85"/><stop offset="0.55" stop-color="#5B1A4A" stop-opacity="0.28"/><stop offset="1" stop-color="#5B1A4A" stop-opacity="0"/></radialGradient>
</defs>
<g>
<rect x="0" y="0" width="1024" height="1024" fill="url(#ground)"/>
<rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>
<g transform="translate(512 497) scale(1.43) translate(-512 -532)">
<g fill="#DFBE6E">
<circle cx="512" cy="306" r="47"/>
<circle cx="296" cy="392" r="43"/>
<circle cx="728" cy="392" r="43"/>
<path d="M296 400 L404 530 L512 352 L620 530 L728 400 L690 646 L334 646 Z" stroke="#DFBE6E" stroke-width="22" stroke-linejoin="round"/>
</g>
<path d="M336 694 H688 L674 742 Q666 770 636 770 H388 Q358 770 350 742 Z" fill="#EAD28E"/>
</g>
</g>
</svg>
